<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}SalesOS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <header class="topbar">
    <a class="brand" href="/">WE TECH</a>
    <nav class="nav" aria-label="Principal">
      <a href="/clientes" {% if secao == "clientes" %}aria-current="page"{% endif %}>Clientes</a>
    </nav>
    <span class="status"><span class="status-dot" aria-hidden="true"></span>Rodando só neste computador</span>
  </header>
  <main id="conteudo" class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
