<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <!-- Keep context-still.svg aligned with the final frame. -->
  <title id="title">Knowledge the next agent can find</title>
  <desc id="description">A document tree connects to a map of product, code, sources, and evidence. Connections appear gradually; the animation ends in under five seconds and respects reduced motion.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090c12"/><stop offset="1" stop-color="#17141e"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#c8b5df" stop-opacity=".12"/><stop offset="1" stop-color="#c8b5df" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#bba6ce" stroke-opacity=".04"/></pattern>
    <clipPath id="frame"><rect width="1600" height="520" rx="20"/></clipPath>
  </defs>
  <style>
    .link { animation: link 2.8s ease-out both; }
    .doc { animation: reveal .9s .3s both; }
    .node { animation: reveal .9s 1s both; }
    .evidence { animation: reveal .9s 1.8s both; }
    .ring { transform-origin: 1050px 300px; animation: ring 4.6s ease-out both; }
    @keyframes link { from { stroke-dasharray: 1000; stroke-dashoffset: 1000; } to { stroke-dasharray: 1000; stroke-dashoffset: 0; } }
    @keyframes reveal { from { opacity: .2; } to { opacity: 1; } }
    @keyframes ring { from { transform: rotate(-24deg); } to { transform: rotate(0); } }
    @media (prefers-reduced-motion: reduce) { .link,.doc,.node,.evidence,.ring { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1600" height="520" fill="url(#bg)"/>
    <rect width="1600" height="520" fill="url(#grid)"/>
    <ellipse cx="1050" cy="300" rx="520" ry="310" fill="url(#halo)"/>
    <text x="76" y="66" fill="#e7ba7d" font-family="monospace" font-size="18" letter-spacing="3">03 / KNOWLEDGE</text>
    <text x="76" y="140" fill="#f5f2eb" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Knowledge that stays accessible.</text>
    <g class="doc">
      <rect x="76" y="190" width="490" height="254" rx="12" fill="#10131b" stroke="#665772"/>
      <path d="M76 236h490" stroke="#665772" stroke-opacity=".5"/>
      <g fill="#bba6ce"><circle cx="102" cy="213" r="4"/><circle cx="118" cy="213" r="4" opacity=".6"/><circle cx="134" cy="213" r="4" opacity=".3"/></g>
      <g font-family="monospace" font-size="23">
        <text x="104" y="278" fill="#f2c58b">AGENTS.md</text>
        <text x="104" y="314" fill="#d5c9e1">├─ PRODUCT.md</text>
        <text x="104" y="350" fill="#d5c9e1">├─ docs/</text>
        <text x="104" y="386" fill="#adb4c2">│  architecture and decisions</text>
        <text x="104" y="422" fill="#d5c9e1">└─ commands and evidence</text>
      </g>
    </g>
    <path class="link" d="M566 314h110q32 0 32-32v-6q0-24 24-24h224" fill="none" stroke="#bba6ce" stroke-width="2" stroke-opacity=".65"/>
    <g class="ring" fill="none" stroke="#bba6ce"><ellipse cx="1050" cy="300" rx="230" ry="143" stroke-opacity=".16"/><ellipse cx="1050" cy="300" rx="230" ry="143" stroke-dasharray="80 1100" stroke-opacity=".8"/></g>
    <g fill="none" stroke="#bba6ce" stroke-width="2" stroke-opacity=".5"><path class="link" d="M1050 300l-146-94m146 94 172-94m-172 94-146 94m146-94 172 94"/></g>
    <g class="node" font-family="monospace" font-size="21" text-anchor="middle">
      <rect x="794" y="180" width="190" height="52" rx="26" fill="#171722" stroke="#8b749e"/><text x="889" y="214" fill="#e0d4eb">PRODUCT</text>
      <rect x="1164" y="180" width="190" height="52" rx="26" fill="#171722" stroke="#8b749e"/><text x="1259" y="214" fill="#e0d4eb">CODE</text>
      <rect x="794" y="368" width="190" height="52" rx="26" fill="#171722" stroke="#8b749e"/><text x="889" y="402" fill="#e0d4eb">SOURCES</text>
    </g>
    <g class="evidence" font-family="monospace" font-size="21" text-anchor="middle"><rect x="1164" y="368" width="228" height="52" rx="26" fill="#211b19" stroke="#c8985b"/><text x="1278" y="402" fill="#f2c58b">EVIDENCE</text></g>
    <circle cx="1050" cy="300" r="68" fill="#11131a" stroke="#e7ba7d" stroke-width="2"/>
    <g fill="none" stroke="#f2c58b" stroke-width="3"><circle cx="1030" cy="289" r="7"/><circle cx="1071" cy="279" r="7"/><circle cx="1061" cy="322" r="7"/><path d="m1037 287 27-7m5 6-7 29m-27-21 21 22"/></g>
    <text x="76" y="484" fill="#aeb7c2" font-family="monospace" font-size="18" letter-spacing="1">SHORT MAP / TRUSTED SOURCES / DETAILS ON DEMAND</text>
  </g>
</svg>
