<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title description">
  <title id="title">Verify before declaring completion</title>
  <desc id="description">Static version: An illustration of lint, types, tests, and build connected to review and evidence. Checks represent stages, not measured results.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#090c12" />
      <stop offset="1" stop-color="#11201b" />
    </linearGradient>
    <linearGradient id="beam">
      <stop stop-color="#9bd4b2" stop-opacity="0" />
      <stop offset=".5" stop-color="#9bd4b2" stop-opacity=".12" />
      <stop offset="1" stop-color="#9bd4b2" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#acd4b7" stroke-opacity=".04" />
    </pattern>
    <clipPath id="frame">
      <rect width="1600" height="520" rx="20" />
    </clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1600" height="520" fill="url(#bg)" />
    <rect width="1600" height="520" fill="url(#grid)" />
    <text x="76" y="66" fill="#e7ba7d" font-family="monospace" font-size="18" letter-spacing="3">04 / VERIFICATION</text>
    <text x="76" y="140" fill="#f5f2eb" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800">Verify before declaring completion.</text>
    <text x="76" y="182" fill="#aeb7c2" font-family="Arial, Helvetica, sans-serif" font-size="23">Configuration earns trust through evidence.</text>
    <path d="M190 292h1220" fill="none" stroke="#94caa6" stroke-width="2" stroke-opacity=".65" />
    <g font-family="monospace" font-size="31" text-anchor="middle" fill="#e0f0e5">
      <g>
        <rect x="76" y="238" width="290" height="108" rx="12" fill="#111b18" stroke="#6b9b7c" />
        <text x="221" y="303">LINT</text>
      </g>
      <g>
        <rect x="462" y="238" width="290" height="108" rx="12" fill="#111b18" stroke="#6b9b7c" />
        <text x="607" y="303">TYPES</text>
      </g>
      <g>
        <rect x="848" y="238" width="290" height="108" rx="12" fill="#111b18" stroke="#6b9b7c" />
        <text x="993" y="303">TESTS</text>
      </g>
      <g>
        <rect x="1234" y="238" width="290" height="108" rx="12" fill="#111b18" stroke="#6b9b7c" />
        <text x="1379" y="303">BUILD</text>
      </g>
    </g>
    <rect x="0" y="218" width="240" height="146" fill="url(#beam)" opacity="0" />
    <path d="M1379 346v64H221v-64" fill="none" stroke="#e7ba7d" stroke-opacity=".5" stroke-width="2" />
    <rect x="511" y="386" width="578" height="48" rx="24" fill="#1d1c16" stroke="#9c7949" />
    <text x="800" y="417" text-anchor="middle" fill="#f2c58b" font-family="monospace" font-size="20" letter-spacing="1">REVIEW / FIX / FRESH EVIDENCE</text>
    <text x="76" y="484" fill="#aeb7c2" font-family="monospace" font-size="18" letter-spacing="1">REAL RESULTS / EXPLICIT LIMITS / NO FALSE PASSES</text>
  </g>
</svg>
